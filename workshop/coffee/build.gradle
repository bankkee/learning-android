plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdkVersion App.compileSdk
    namespace "com.learning.coffee"

    defaultConfig {
        minSdkVersion App.minSdk
        targetSdkVersion App.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding = true
    }
    testOptions {
        unitTests.all {
            // Mockito 4.2.0 มากับ Byte Buddy ที่รู้จักถึง Java 18 บรรทัดนี้ให้ mock ได้บน JDK ที่ใหม่กว่า
            jvmArgs '-Dnet.bytebuddy.experimental=true'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation Libraries.kotlin
    implementation Libraries.ktxCore
    implementation SupportLibraries.appcompat
    implementation SupportLibraries.constraintLayout
    implementation SupportLibraries.design
    implementation SupportLibraries.recyclerView
    implementation Libraries.lifecycleLiveData
    implementation Libraries.lifecycleViewModel

    //Koin
    implementation Libraries.koinAndroid
    implementation Libraries.koinScope
    implementation Libraries.koinViewModel

    implementation project(Modules.core)
    implementation project(Modules.apilayer)

    testImplementation TestLibraries.junit
    testImplementation TestLibraries.mockito
    testImplementation TestLibraries.mockitoKotlin
    testImplementation TestLibraries.mockitoInline
    testImplementation TestLibraries.kotlinTest
    testImplementation TestLibraries.kotlinxCoroutines
    testImplementation TestLibraries.coreTest
}
