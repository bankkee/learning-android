plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.learning.playground"
    compileSdk 36

    defaultConfig {
        applicationId "com.learning.playground"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    // build type คือแอปเดียวกันที่ build คนละแบบ เลือกได้ที่ Build Variants ใน Android Studio
    buildTypes {
        debug {
            buildConfigField "String", "BRANCH_NAME", "\"สาขาทดสอบ\""
        }
        release {
            buildConfigField "String", "BRANCH_NAME", "\"สาขาจริง\""
            minifyEnabled false
            // ใช้กุญแจของ debug เพื่อให้รันแบบ release บน emulator ได้ แอปจริงต้องใช้กุญแจของตัวเอง
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.2.1"

    testImplementation "junit:junit:4.13.2"
}
